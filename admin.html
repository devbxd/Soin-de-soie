<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Soin de Soie</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-row">
    <a class="brandmark" href="index.html">
      <svg viewBox="0 0 32 32" fill="none"><path d="M16 6c-3 3-3 7 0 10-3-3-7-3-10 0 3-3 3-7 0-10 3 3 7 3 10 0Z" fill="var(--rose)"/><path d="M16 6c3 3 3 7 0 10 3-3 7-3 10 0-3-3-3-7 0-10-3 3-7 3-10 0Z" fill="var(--gold)"/><circle cx="16" cy="16" r="1.6" fill="var(--wine)"/></svg>
      <span>Soin de Soie — Admin</span>
    </a>
    <button type="button" class="btn" id="logout-btn">Log out</button>
  </div>
</header>

<div class="admin-shell">

  <div class="admin-login" id="admin-login">
    <h1>Admin Login</h1>
    <form id="login-form" class="admin-form">
      <label class="label" for="login-password">Password</label>
      <input type="password" id="login-password" required>
      <p id="login-error" class="label" style="color:var(--wine); margin-top:10px;" hidden></p>
      <button type="submit" class="btn solid" style="margin-top:16px;">Log in</button>
    </form>
  </div>

  <div id="admin-dashboard" hidden>
    <div class="tabs">
      <button type="button" class="tab-btn active" data-tab="products">Products</button>
      <button type="button" class="tab-btn" data-tab="orders">Orders</button>
    </div>

    <div class="tab-panel" id="tab-products">
      <div class="manage-section" style="margin-bottom:20px;">
        <h4>Categories</h4>
        <div class="variant-list" id="category-chips"></div>
        <form id="add-category-form" class="admin-form" style="margin-top:10px; flex-direction:row; gap:10px; align-items:flex-end;">
          <div style="flex:1;">
            <label class="label">New category name</label>
            <input type="text" name="name" placeholder="e.g. Fragrance" required>
          </div>
          <button type="submit" class="btn">Add category</button>
        </form>
      </div>

      <button type="button" class="btn solid" id="add-product-toggle" style="margin-bottom:16px;">+ Add Product</button>

      <form id="add-product-form" class="admin-form" hidden style="margin-bottom:24px; padding:16px; border:1px solid var(--hairline); background:var(--surface);">
        <label class="label">Name</label>
        <input type="text" name="name" required>

        <label class="label" style="margin-top:12px;">Category</label>
        <select name="category" required></select>

        <label class="label" style="margin-top:12px;">Description</label>
        <textarea name="description" rows="2"></textarea>

        <label class="label" style="margin-top:12px;">Price (USD)</label>
        <input type="number" name="price" step="0.01" min="0" value="0">

        <label class="label" style="margin-top:12px;">Discount</label>
        <div style="display:flex; gap:10px;">
          <select name="discount_type" style="flex:1;">
            <option value="none">No discount</option>
            <option value="percent">Percent off</option>
            <option value="fixed">Fixed amount off</option>
          </select>
          <input type="number" name="discount_value" min="0" value="0" style="flex:1;" placeholder="e.g. 15">
        </div>

        <label class="checkbox-row"><input type="checkbox" name="in_stock" checked> In stock</label>
        <label class="checkbox-row"><input type="checkbox" name="is_featured"> Featured on homepage</label>

        <div class="hero-cta" style="margin-top:16px;">
          <button type="submit" class="btn solid">Create product</button>
        </div>
      </form>

      <div id="product-list"></div>
    </div>

    <div class="tab-panel" id="tab-orders" hidden>
      <div id="order-list"></div>
    </div>
  </div>

</div>

<script src="assets/js/admin.js"></script>
</body>
</html>
