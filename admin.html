<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Soin de Soie</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-row">
    <a class="brandmark" href="index.html">
      <svg viewBox="0 0 32 32" fill="none"><path d="M16 6c-3 3-3 7 0 10-3-3-7-3-10 0 3-3 3-7 0-10 3 3 7 3 10 0Z" fill="var(--rose)"/><path d="M16 6c3 3 3 7 0 10 3-3 7-3 10 0-3-3-3-7 0-10-3 3-7 3-10 0Z" fill="var(--gold)"/><circle cx="16" cy="16" r="1.6" fill="var(--wine)"/></svg>
      <span>Soin de Soie — Admin</span>
    </a>
    <button type="button" class="btn" id="logout-btn">Log out</button>
  </div>
</header>

<div class="admin-login" id="admin-login">
  <h1>Admin Login</h1>
  <form id="login-form" class="admin-form">
    <label class="label" for="login-password">Password</label>
    <input type="password" id="login-password" required>
    <p id="login-error" class="label" style="color:var(--wine); margin-top:10px;" hidden></p>
    <button type="submit" class="btn solid" style="margin-top:16px;">Log in</button>
  </form>
</div>

<div class="admin-layout" id="admin-dashboard" hidden>
  <aside class="admin-sidebar">
    <button type="button" class="admin-nav-btn active" data-section="products">Products</button>
    <button type="button" class="admin-nav-btn" data-section="categories">Categories</button>
    <button type="button" class="admin-nav-btn" data-section="orders">Orders</button>
  </aside>

  <main class="admin-main">
    <section id="section-products">
      <h2>Products</h2>
      <div id="product-form-container"></div>
      <button type="button" class="btn solid big" id="add-product-btn" style="margin-bottom:20px;">+ Add Product</button>
      <div id="product-list"><p>Loading…</p></div>
    </section>

    <section id="section-categories" hidden>
      <h2>Categories</h2>
      <div class="category-tree" id="category-tree"><p>Loading…</p></div>
      <form id="add-category-form" class="admin-form" style="flex-direction:row; gap:10px; align-items:flex-end; max-width:420px;">
        <div style="flex:1;">
          <label class="label">New category</label>
          <input type="text" name="name" placeholder="e.g. Fragrance" required>
        </div>
        <button type="submit" class="btn">Add category</button>
      </form>
    </section>

    <section id="section-orders" hidden>
      <h2>Orders</h2>
      <div id="order-list"><p>Loading…</p></div>
    </section>
  </main>
</div>

<script src="assets/js/admin.js"></script>
</body>
</html>
